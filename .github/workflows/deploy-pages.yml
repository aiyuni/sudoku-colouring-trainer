name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build frontend
        working-directory: frontend
        env:
          # Project site: https://<user>.github.io/sudoku-solver/
          # For a user site repo named <user>.github.io, change this to /
          VITE_BASE: /${{ github.event.repository.name }}/
          # Import analytics endpoint (analytics/ Worker). A repo *variable*,
          # not a secret - it's a public URL. Unset = analytics disabled.
          VITE_ANALYTICS_URL: ${{ vars.VITE_ANALYTICS_URL }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The same site at https://sudoku-trainer.sekaiproject.ca (a static-assets
  # Cloudflare Worker, frontend/wrangler.jsonc). Its own build: it lives at
  # the domain root, so VITE_BASE stays "/". Needs the repo secrets
  # CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, Workers Routes: Edit and
  # DNS: Edit on sekaiproject.ca) and CLOUDFLARE_ACCOUNT_ID; without the token
  # the job does nothing, so GitHub Pages still deploys.
  cloudflare:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set - skipping the sudoku-trainer.sekaiproject.ca deploy."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: frontend
        env:
          VITE_ANALYTICS_URL: ${{ vars.VITE_ANALYTICS_URL }}
        run: |
          npm ci
          npm run deploy:cloudflare
